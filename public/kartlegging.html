<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kartlegging – Praktisk Intelligens</title>
<style>
  :root { --navy: #1a2332; --accent: #f0a500; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--navy); color: #fff;
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 2rem 1rem;
  }
  header { text-align: center; margin-bottom: 2.5rem; }
  .logo { font-size: 1.1rem; font-weight: 600; color: var(--accent); letter-spacing: .05em; text-transform: uppercase; margin-bottom: .5rem; }
  h1 { font-size: 1.75rem; font-weight: 700; color: #fff; line-height: 1.2; }
  .cards { display: flex; flex-direction: column; gap: 1.25rem; width: 100%; max-width: 480px; }
  a.card {
    display: block; text-decoration: none; border-radius: 14px;
    padding: 1.75rem 2rem; transition: transform .15s, box-shadow .15s;
  }
  a.card:hover { transform: translateY(-3px); box-shadow: 0 8px 30px rgba(0,0,0,.4); }
  .card-primary {
    background: var(--accent); color: var(--navy);
  }
  .card-secondary {
    background: transparent; color: #fff;
    border: 2px solid rgba(255,255,255,.25);
  }
  .card-secondary:hover { border-color: rgba(255,255,255,.5); }
  .badge {
    display: inline-block; font-size: .65rem; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase;
    background: var(--navy); color: var(--accent);
    border-radius: 4px; padding: 2px 8px; margin-bottom: .75rem;
  }
  .card-secondary .badge { background: rgba(255,255,255,.12); color: rgba(255,255,255,.7); }
  .card-title { font-size: 1.3rem; font-weight: 700; margin-bottom: .4rem; }
  .card-sub { font-size: .85rem; opacity: .75; }
  .card-primary .card-sub { opacity: .7; }
</style>
</head>
<body>
  <header>
    <div class="logo">🧠 Praktisk Intelligens</div>
    <h1>Velg kartleggingsmetode</h1>
  </header>
  <div class="cards">
    <a class="card card-primary" href="kartlegging-v4.html">
      <div class="badge">✅ Anbefalt</div>
      <div class="card-title">📋 Spørreundersøkelse</div>
      <div class="card-sub">10-15 min · Strukturerte spørsmål · Grundig kartlegging</div>
    </a>
    <a class="card card-secondary" href="kartlegging-v6-ai.html">
      <div class="badge">🆕 Ny</div>
      <div class="card-title">🤖 KI-drevet samtale</div>
      <div class="card-sub">5–10 min · Ekte KI-analyse · Personlige råd</div>
    </a>
  </div>
</body>
</html>
